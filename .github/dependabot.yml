# Dependabot configuration.
# Only github-actions is enabled now because the npm workspace and Dockerfile
# do not exist yet (Dependabot reports errors for ecosystems with no manifest).
# Enable the commented blocks as part of the monorepo-skeleton issue (M0) and
# when the Dockerfile is added.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

