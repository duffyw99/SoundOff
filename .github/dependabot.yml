# Dependabot configuration.
# github-actions and npm (workspaces, via the root lockfile) are enabled.
# Enable the commented Docker block when a Dockerfile is added (M0-7).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The runtime is Node 22 (.nvmrc, engines), so keep the type definitions on 22 too.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # --- Enable once a Dockerfile exists ---
  # - package-ecosystem: "docker"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   commit-message:
  #     prefix: "chore(docker)"
