name: CI

# Public repo safety:
# - Uses pull_request (NOT pull_request_target), so fork PRs never receive secrets.
# - Read-only token permissions.
# - No deployment happens in this workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The monorepo skeleton does not exist yet. Until a root package.json
      # is added, the remaining steps are skipped and the job passes.
      - name: Detect project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
            echo "No package.json found; skipping build steps."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.has_project == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.has_project == 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.has_project == 'true'
        run: npm run lint --workspaces --if-present

      - name: Typecheck
        if: steps.detect.outputs.has_project == 'true'
        run: npm run typecheck --workspaces --if-present

      - name: Test
        if: steps.detect.outputs.has_project == 'true'
        run: npm test --workspaces --if-present

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
